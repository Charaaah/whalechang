<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEEP SEA TERMINAL — WHALE MAID // ASCII POINT CLOUD</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; min-height: 100%; background: #020609;
    overflow: hidden;
  }
  body {
    display: grid; place-items: center;
    width: 100vw; height: 100vh;
    font-family: "Courier New", monospace;
    background:
      radial-gradient(ellipse at 50% 44%, #0b1b24 0%, #040a0f 46%, #010204 100%);
  }
  #wrap {
    width: min(100vw, calc(100vh * 1600 / 960));
    aspect-ratio: 1600 / 960;
    position: relative;
    filter: drop-shadow(0 26px 60px rgba(0, 0, 0, .75));
  }
  canvas {
    display: block; width: 100%; height: 100%;
    cursor: grab;
    touch-action: none;
    outline: none;
  }
  canvas.dragging { cursor: grabbing; }
  .a11y {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="crt" width="1600" height="960" tabindex="0"
    aria-label="一个由可朝向盒子采样成点云、再经软件投影转成 120×45 字符的 3D 鲸鱼女仆 CRT 终端。左右拖动可做完整 360 度环绕，看到正面和背面。"></canvas>
  <p class="a11y">左右拖动画面可 360 度环绕鲸鱼娘。方向键微调角度，按 R 复位到正面。</p>
</div>
<script>
(() => {
  'use strict';

  // ============================================================
  // FIXED GEOMETRY / FIXED CANVAS
  // ============================================================
  const W = 1600, H = 960;
  const GRID_W = 120, GRID_H = 45;
  const CELL_W = 8, CELL_H = 16;
  const INNER_W = GRID_W * CELL_W;      // 960
  const INNER_H = GRID_H * CELL_H;      // 720
  const INNER_X = 320, INNER_Y = 120;
  const TAU = Math.PI * 2;

  // The previous SW-01 / FDD-0A experiments are disabled pending a proper
  // control review. Their geometry and HUD are kept behind this one flag.
  const UTILITY_PROPS_ENABLED = false;

  const canvas = document.getElementById('crt');
  const ctx = canvas.getContext('2d', { alpha: false });
  ctx.textBaseline = 'middle';

  const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
  const mix = (a, b, t) => a + (b - a) * t;
  const fract = v => v - Math.floor(v);

  // Deterministic point jitter. No nondeterministic source is used anywhere
  // in this document; all variation is a pure function of point indices.
  function hash(n) {
    return fract(Math.sin(n * 127.1 + 311.7) * 43758.5453123);
  }

  // ============================================================
  // COLOR / ALBEDO
  // ============================================================
  function hx(s) {
    const n = parseInt(s.slice(1), 16);
    return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
  }
  function albedo(rgb) {
    // Per-point albedo, not a per-material lighting shortcut. This is what
    // separates a black recess from a white switch when both normals agree.
    return 0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2];
  }

  const P = {
    ink:      hx('#071128'),
    navy:     hx('#1a2b5f'),
    navy2:    hx('#223b7d'),
    blue:     hx('#315bb2'),
    blue2:    hx('#4d82d9'),
    sky:      hx('#86c2f5'),
    ice:      hx('#d2ebff'),
    white:    hx('#f3f7ff'),
    paper:    hx('#dfe9f5'),
    skin:     hx('#ffd7ca'),
    skin2:    hx('#f1b9ad'),
    blush:    hx('#e9949e'),
    mouth:    hx('#55223a'),
    tongue:   hx('#d97486'),
    eyeDeep:  hx('#061634'),
    eyeBlue:  hx('#a9edff'),
    eyeCyan:  hx('#edffff'),
    eyeSpark: hx('#ffffff'),
    gold:     hx('#c89d58'),
    steel:    hx('#7c8d9e'),
    steelDk:  hx('#27313d'),
    console:  hx('#1b2730'),
    console2: hx('#314450'),
    lamp:     hx('#91f5c9'),
    lampDim:  hx('#1e5548'),
    rubber:   hx('#0d1218')
  };

  // ============================================================
  // ORIENTED BOX MODEL
  // ============================================================
  const boxes = [];
  let boxId = 0;

  function rotationAxes(rx, ry, rz) {
    const cx = Math.cos(rx), sx = Math.sin(rx);
    const cy = Math.cos(ry), sy = Math.sin(ry);
    const cz = Math.cos(rz), sz = Math.sin(rz);
    // R = Rz * Ry * Rx. Columns are the local axes in world space.
    return [
      [cz * cy, sz * cy, -sy],
      [cz * sy * sx - sz * cx, sz * sy * sx + cz * cx, cy * sx],
      [cz * sy * cx + sz * sx, sz * sy * cx - cz * sx, cy * cx]
    ];
  }

  function box(x, y, z, w, h, d, color, opt = {}) {
    const [ax, ay, az] = rotationAxes(opt.rx || 0, opt.ry || 0, opt.rz || 0);
    boxes.push({
      id: boxId++, x, y, z, hw: w * 0.5, hh: h * 0.5, hd: d * 0.5,
      ax, ay, az, color, tag: opt.tag || '', layer: opt.layer || 0
    });
  }

  function beam(x1, y1, x2, y2, width, depth, z, color, opt = {}) {
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.hypot(dx, dy);
    if (len < 0.0001) return;
    const ang = Math.atan2(dy, dx);
    box((x1 + x2) * 0.5, (y1 + y2) * 0.5, z,
        len + width * 0.28, width, depth, color,
        { rz: ang, tag: opt.tag, layer: opt.layer });
  }

  // ------------------------------------------------------------
  // The character is authored in a single 3D scene. Units are not
  // pixels: world units are projected by the software camera later.
  // ------------------------------------------------------------
  function buildModel() {
    // --- shoes + socks ------------------------------------------------
    for (const side of [-1, 1]) {
      const x = side * 0.235;
      box(x, 0.095, 0.18, 0.30, 0.17, 0.40, P.navy, { rz: side * 0.035 });
      box(x, 0.095, 0.385, 0.25, 0.115, 0.10, P.blue, { rz: side * 0.035 });
      box(x, 0.205, 0.13, 0.17, 0.20, 0.22, P.white);
      // scalloped sock ruffle
      for (let i = 0; i < 3; i++) {
        box(x + (i - 1) * 0.055, 0.315, 0.235, 0.058, 0.065, 0.045, P.white,
            { rz: (i - 1) * 0.25 });
      }
      box(x, 0.42, 0.08, 0.14, 0.23, 0.16, P.skin);
      box(x, 0.33, 0.32, 0.10, 0.10, 0.055, P.gold, { rz: side * 0.15 });
    }

    // --- skirt / dress volume ----------------------------------------
    box(0, 0.82, 0.00, 0.90, 0.55, 0.62, P.navy);
    box(-0.40, 0.75, 0.00, 0.35, 0.53, 0.58, P.navy2, { rz: 0.16 });
    box(0.40, 0.75, 0.00, 0.35, 0.53, 0.58, P.navy2, { rz: -0.16 });
    box(0, 0.55, 0.01, 1.06, 0.19, 0.66, P.navy2);
    box(-0.47, 0.54, 0.02, 0.24, 0.18, 0.62, P.navy2, { rz: 0.25 });
    box(0.47, 0.54, 0.02, 0.24, 0.18, 0.62, P.navy2, { rz: -0.25 });
    // white ruffle hem
    for (let i = 0; i < 11; i++) {
      const t = i / 10;
      const x = mix(-0.56, 0.56, t);
      const y = 0.475 - Math.pow(Math.abs(t - 0.5) * 2, 2) * 0.015;
      box(x, y, 0.322, 0.115, 0.095, 0.055, P.white,
          { rz: (t - 0.5) * 0.35, layer: 4 });
    }
    // side hem ruffles
    for (const side of [-1, 1]) {
      for (let i = 0; i < 3; i++) {
        box(side * (0.54 + i * 0.028), 0.50 + i * 0.06, 0.14 - i * 0.055,
            0.10, 0.08, 0.20, P.white, { rz: side * 0.2 });
      }
    }

    // --- white apron --------------------------------------------------
    box(0, 0.965, 0.325, 0.43, 0.42, 0.045, P.white, { layer: 5 });
    box(0, 0.755, 0.342, 0.54, 0.16, 0.052, P.white, { rx: -0.10, layer: 5 });
    box(0, 1.245, 0.300, 0.34, 0.25, 0.045, P.white, { layer: 5 });
    // ruffle around apron bottom and bib
    for (let i = 0; i < 7; i++) {
      const x = mix(-0.30, 0.30, i / 6);
      box(x, 0.675 + Math.abs(x) * 0.025, 0.365, 0.085, 0.065, 0.025, P.white, { layer: 6 });
    }
    for (const side of [-1, 1]) {
      box(side * 0.30, 0.91, 0.350, 0.055, 0.30, 0.03, P.white, { rz: side * 0.12, layer: 6 });
    }
    // little blue whale icon on the apron
    box(0.015, 0.875, 0.385, 0.175, 0.095, 0.016, P.blue2, { layer: 8 });
    box(0.085, 0.895, 0.386, 0.085, 0.105, 0.016, P.blue2, { layer: 8 });
    box(-0.105, 0.895, 0.386, 0.060, 0.055, 0.016, P.sky, { rz: 0.45, layer: 8 });
    box(0.07, 0.833, 0.386, 0.024, 0.024, 0.012, P.ice, { layer: 8 });
    box(0.00, 0.955, 0.386, 0.018, 0.070, 0.012, P.ice, { layer: 8 });
    box(-0.045, 0.980, 0.386, 0.035, 0.020, 0.012, P.ice, { rz: -0.4, layer: 8 });

    // gold details on skirt
    for (const side of [-1, 1]) {
      box(side * 0.40, 0.83, 0.355, 0.025, 0.25, 0.018, P.gold, { rz: side * -0.28, layer: 6 });
      box(side * 0.32, 0.58, 0.35, 0.055, 0.028, 0.020, P.gold, { layer: 6 });
    }

    // --- torso / blouse ----------------------------------------------
    box(0, 1.36, 0.00, 0.61, 0.44, 0.48, P.navy);
    box(0, 1.38, 0.255, 0.32, 0.30, 0.055, P.white, { layer: 3 });
    for (let i = 0; i < 3; i++) {
      box(0, 1.30 + i * 0.075, 0.292, 0.035, 0.035, 0.018, P.navy2, { layer: 5 });
    }
    box(0, 1.515, 0.285, 0.46, 0.10, 0.055, P.white, { layer: 4 });
    box(0, 1.115, 0.00, 0.66, 0.16, 0.53, P.navy2);
    box(0, 1.12, 0.295, 0.57, 0.045, 0.045, P.gold, { layer: 4 });
    // neck ribbon + gem
    box(0, 1.57, 0.31, 0.075, 0.11, 0.065, P.navy);
    box(-0.11, 1.60, 0.315, 0.14, 0.10, 0.060, P.navy2, { rz: -0.30 });
    box(0.11, 1.60, 0.315, 0.14, 0.10, 0.060, P.navy2, { rz: 0.30 });
    box(0, 1.575, 0.365, 0.075, 0.075, 0.050, P.eyeCyan, { layer: 7 });
    box(-0.012, 1.595, 0.392, 0.025, 0.026, 0.012, P.eyeSpark, { layer: 8 });

    // collar / neck
    box(0, 1.66, 0.075, 0.18, 0.16, 0.16, P.skin);
    box(0, 1.645, 0.18, 0.34, 0.075, 0.10, P.white, { layer: 4 });
    for (const side of [-1, 1]) {
      box(side * 0.20, 1.65, 0.24, 0.15, 0.06, 0.06, P.white, { rz: side * 0.2 });
    }

    // --- arms ---------------------------------------------------------
    for (const side of [-1, 1]) {
      const sx = side * 0.42;
      box(sx, 1.52, 0.04, 0.23, 0.22, 0.24, P.white);
      for (let i = 0; i < 3; i++) {
        box(sx + side * (i - 1) * 0.054, 1.43, 0.145, 0.055, 0.070, 0.070, P.white);
      }
      beam(sx, 1.45, side * 0.65, 1.29, 0.14, 0.16, 0.11, P.navy2);
      beam(side * 0.63, 1.31, side * 0.76, 1.19, 0.13, 0.15, 0.18, P.white);
      beam(side * 0.76, 1.19, side * 0.93, 1.14, 0.105, 0.125, 0.23, P.skin);
      box(side * 0.975, 1.135, 0.255, 0.105, 0.115, 0.13, P.skin, { rz: side * 0.25 });
      // small thumb
      box(side * 0.995, 1.19, 0.275, 0.045, 0.075, 0.055, P.skin2, { rz: side * -0.2 });
    }

    // --- tail ---------------------------------------------------------
    const tail = [
      [0.20, 0.92, -0.30, 0.30, 0.32],
      [0.54, 0.74, -0.23, 0.28, 0.34],
      [0.94, 0.76, -0.13, 0.25, 0.32],
      [1.23, 0.94, -0.01, 0.21, 0.28],
      [1.44, 1.12, 0.07, 0.18, 0.24]
    ];
    for (let i = 0; i < tail.length - 1; i++) {
      const a = tail[i], b = tail[i + 1];
      beam(a[0], a[1], b[0], b[1], mix(a[4], b[4], 0.5), 0.38,
           mix(a[2], b[2], 0.5), i < 2 ? P.navy2 : P.blue);
    }
    // Broad flukes: a readable tail silhouette around the right hip.
    beam(1.43, 1.12, 1.84, 1.46, 0.246, 0.30, 0.10, P.blue);
    beam(1.43, 1.12, 1.82, 0.97, 0.218, 0.28, 0.09, P.blue);
    beam(1.43, 1.12, 1.63, 1.07, 0.120, 0.32, 0.115, P.blue2);
    // pale leading edge and a visible lower rib
    beam(1.50, 1.25, 1.80, 1.43, 0.060, 0.24, 0.18, P.sky);
    beam(1.50, 1.03, 1.79, 1.00, 0.050, 0.22, 0.16, P.ice);
    beam(1.27, 0.98, 1.45, 1.10, 0.045, 0.27, 0.16, P.sky);

    // --- back hair mass ----------------------------------------------
    box(0, 2.34, -0.17, 1.26, 1.16, 0.64, P.navy);
    box(0, 1.75, -0.24, 1.45, 0.92, 0.52, P.navy);
    // Side hair needs volume behind the strands; thin locks alone read as
    // disconnected scan lines at this character-cell resolution.
    for (const side of [-1, 1]) {
      box(side * 0.73, 2.10, -0.06, 0.40, 0.84, 0.50, P.navy, { rz: side * 0.05 });
      box(side * 0.79, 1.52, -0.08, 0.35, 0.66, 0.46, P.navy2, { rz: side * 0.08 });
      box(side * 0.74, 0.99, -0.03, 0.32, 0.50, 0.40, P.blue, { rz: side * -0.04 });
    }
    // side waterfall locks
    for (const side of [-1, 1]) {
      const chains = [
        [[0.55, 2.55, 0.09], [0.82, 1.98, -0.03], [0.74, 1.34, -0.08], [0.88, 0.78, -0.06], [0.71, 0.28, -0.02]],
        [[0.68, 2.48, -0.15], [0.94, 1.88, -0.19], [0.91, 1.24, -0.17], [1.04, 0.70, -0.10], [0.91, 0.18, -0.05]],
        [[0.47, 2.42, 0.18], [0.66, 1.86, 0.16], [0.56, 1.34, 0.09], [0.65, 0.84, 0.05], [0.54, 0.42, 0.05]]
      ];
      for (let c = 0; c < chains.length; c++) {
        const chain = chains[c];
        const widths = [0.30, 0.28, 0.25, 0.22];
        // Mirror x only. The previous version also mirrored z, which put one
        // side of the hair behind the head and the other in front of it.
        const zs = chain.map(p => p[2]);
        for (let i = 0; i < chain.length - 1; i++) {
          const a = chain[i], b = chain[i + 1];
          const ca = (i < 2 ? P.navy : (i === 2 ? P.blue : P.blue2));
          beam(side * a[0], a[1], side * b[0], b[1], widths[i], 0.38, zs[i], ca);
        }
        // bright strand close to the silhouette
        for (let i = 1; i < chain.length - 1; i++) {
          const a = chain[i], b = chain[i + 1];
          beam(side * (a[0] + 0.035), a[1] - 0.02, side * (b[0] + 0.03), b[1] + 0.01,
               0.040, 0.20, zs[i] + 0.18, i > 2 ? P.sky : P.blue2);
        }
      }
    }
    // interior long locks
    for (const side of [-1, 1]) {
      beam(side * 0.38, 2.28, side * 0.52, 1.72, 0.19, 0.29, 0.17, P.navy2);
      beam(side * 0.52, 1.72, side * 0.44, 1.18, 0.17, 0.27, 0.14, P.blue);
      beam(side * 0.44, 1.18, side * 0.52, 0.68, 0.14, 0.25, 0.12, P.blue2);
    }
    // little brighter waves at the tips
    for (const side of [-1, 1]) {
      beam(side * 0.88, 0.82, side * 0.74, 0.34, 0.055, 0.22, 0.12, P.sky);
      beam(side * 0.99, 0.74, side * 0.94, 0.27, 0.045, 0.20, 0.08, P.ice);
    }

    // --- face ---------------------------------------------------------
    box(0, 2.34, 0.09, 1.03, 0.82, 0.70, P.skin);
    // soft jaw shading
    box(0, 1.985, 0.37, 0.52, 0.075, 0.15, P.skin2, { layer: 1 });
    // eyes: a dark socket + a large luminous iris. A tiny white sclera rim
    // turns into a hollow square at this cell resolution, so the iris itself
    // carries the eye shape while white is kept only in catchlights.
    for (const side of [-1, 1]) {
      const ex = side * 0.255, ey = 2.318;
      box(ex, ey, 0.452, 0.420, 0.400, 0.055, P.ink, { layer: 2 });
      box(ex, ey - 0.005, 0.470, 0.334, 0.356, 0.030, P.eyeDeep, { layer: 3, rx: 0.01 });
      box(ex + side * 0.006, ey - 0.012, 0.486, 0.300, 0.334, 0.020, P.eyeBlue, { layer: 4 });
      box(ex + side * 0.014, ey - 0.074, 0.497, 0.222, 0.152, 0.014, P.eyeCyan, { layer: 5 });
      // A pupil wide enough for its centre cell to survive Sobel, but small
      // enough that the luminous iris still rings it.
      box(ex + side * 0.005, ey - 0.010, 0.506, 0.108, 0.190, 0.010, P.ink, { layer: 6 });
      // a small white sclera triangle at the inner corner, not a full rim
      box(ex - side * 0.126, ey - 0.055, 0.501, 0.045, 0.105, 0.010, P.white, { layer: 6, rz: side * 0.18 });
      box(ex + side * 0.052, ey + 0.100, 0.520, 0.086, 0.062, 0.010, P.eyeSpark, { layer: 7, rz: side * 0.12 });
      box(ex - side * 0.065, ey - 0.105, 0.521, 0.034, 0.034, 0.008, P.eyeSpark, { layer: 7 });
      // Heavy upper lid in front of the iris. It survives the 8x16 reduction
      // as a dark anime lash instead of dissolving into the blue iris.
      box(ex, ey + 0.163, 0.535, 0.432, 0.095, 0.012, P.ink, { rz: side * -0.10, layer: 9 });
      box(ex + side * 0.205, ey + 0.142, 0.525, 0.108, 0.040, 0.015, P.ink, { rz: side * 0.45, layer: 9 });
      // lash line, corner flick
      box(ex, ey + 0.192, 0.485, 0.432, 0.055, 0.052, P.navy, { rz: side * -0.10, layer: 5 });
      box(ex + side * 0.205, ey + 0.142, 0.490, 0.108, 0.034, 0.035, P.navy, { rz: side * 0.45, layer: 5 });
      // lower lid catches the face light
      box(ex, ey - 0.196, 0.481, 0.330, 0.028, 0.032, P.skin2, { layer: 4 });
      // brow
      box(ex, ey + 0.258, 0.472, 0.235, 0.028, 0.032, P.navy, { rz: side * -0.12, layer: 5 });
      // blush
      box(side * 0.430, 2.085, 0.438, 0.120, 0.050, 0.018, P.blush, { layer: 3 });
    }
    // small open smile
    box(0, 2.045, 0.452, 0.145, 0.125, 0.035, P.mouth, { layer: 4 });
    box(0, 2.008, 0.471, 0.105, 0.050, 0.022, P.tongue, { layer: 5 });
    box(-0.074, 2.088, 0.468, 0.038, 0.050, 0.020, P.skin2, { rz: -0.35, layer: 5 });
    box(0.074, 2.088, 0.468, 0.038, 0.050, 0.020, P.skin2, { rz: 0.35, layer: 5 });

    // --- bangs --------------------------------------------------------
    const bangs = [
      [-0.47, 2.84, -0.53, 2.55, 0.22, 0.23, P.navy],
      [-0.30, 2.90, -0.36, 2.52, 0.18, 0.24, P.navy2],
      [-0.12, 2.95, -0.16, 2.58, 0.17, 0.25, P.navy2],
      [ 0.05, 2.96,  0.02, 2.56, 0.19, 0.25, P.navy2],
      [ 0.23, 2.91,  0.29, 2.53, 0.18, 0.24, P.blue],
      [ 0.41, 2.85,  0.48, 2.56, 0.20, 0.23, P.navy2],
      [ 0.56, 2.76,  0.61, 2.44, 0.16, 0.22, P.navy]
    ];
    for (const b of bangs) {
      beam(b[0], b[1], b[2], b[3], b[4], b[5], 0.455, b[6], { layer: 2 });
    }
    // highlight ribbons in the bangs
    beam(-0.26, 2.85, -0.32, 2.66, 0.035, 0.08, 0.575, P.sky, { layer: 8 });
    beam(0.12, 2.89, 0.10, 2.68, 0.032, 0.08, 0.578, P.blue2, { layer: 8 });
    beam(0.34, 2.83, 0.39, 2.65, 0.030, 0.08, 0.570, P.sky, { layer: 8 });
    // crown / top hair
    box(0, 2.84, -0.01, 1.04, 0.28, 0.66, P.navy2);
    box(-0.42, 2.67, 0.05, 0.36, 0.49, 0.54, P.navy, { rz: 0.09 });
    box(0.42, 2.67, 0.05, 0.36, 0.49, 0.54, P.navy, { rz: -0.09 });

    // --- maid headdress ----------------------------------------------
    box(0, 2.785, 0.290, 0.96, 0.155, 0.17, P.white, { layer: 6 });
    box(0, 2.74, 0.330, 0.78, 0.095, 0.10, P.paper, { layer: 6 });
    for (let i = 0; i < 11; i++) {
      const t = i / 10 * 2 - 1;
      const x = t * 0.70;
      const y = 2.86 + (1 - t * t) * 0.19;
      box(x, y, 0.285 + (1 - Math.abs(t)) * 0.05, 0.175, 0.180, 0.16, P.white,
          { rz: t * 0.55, rx: t * 0.15, layer: 7 });
    }
    // tiny lace edge
    for (let i = 0; i < 9; i++) {
      const t = i / 8 * 2 - 1;
      box(t * 0.64, 2.83 + (1 - t * t) * 0.13, 0.375,
          0.065, 0.085, 0.035, P.paper, { rz: t * 0.55, layer: 8 });
    }

    // --- blue bows at the sides --------------------------------------
    for (const side of [-1, 1]) {
      const bx = side * 0.72, by = 2.72, bz = 0.34;
      // side-set bows sit on top of the whale ears
      box(bx, by, bz, 0.10, 0.13, 0.09, P.blue2, { layer: 7 });
      beam(bx, by, bx + side * 0.23, by + 0.09, 0.15, 0.12, bz + 0.03, P.sky, { layer: 7 });
      beam(bx, by, bx + side * 0.22, by - 0.08, 0.14, 0.12, bz + 0.03, P.blue2, { layer: 7 });
      beam(bx - side * 0.015, by - 0.02, bx + side * 0.070, by - 0.245, 0.085, 0.09, bz + 0.02, P.sky, { layer: 6 });
      beam(bx + side * 0.060, by - 0.02, bx + side * 0.185, by - 0.205, 0.072, 0.09, bz + 0.02, P.blue2, { layer: 6 });
    }

    // --- whale ear fins + white ruffle base --------------------------
    for (const side of [-1, 1]) {
      beam(side * 0.55, 2.46, side * 1.08, 2.31, 0.21, 0.22, 0.115, P.navy, { layer: 1 });
      beam(side * 0.60, 2.35, side * 1.02, 2.06, 0.18, 0.20, 0.085, P.navy);
      beam(side * 0.66, 2.22, side * 0.92, 1.99, 0.12, 0.17, 0.10, P.blue);
      // pale underside / fin membrane
      beam(side * 0.64, 2.42, side * 1.01, 2.30, 0.060, 0.195, 0.175, P.ice, { layer: 5 });
      beam(side * 0.70, 2.29, side * 0.95, 2.10, 0.045, 0.17, 0.135, P.sky, { layer: 5 });
      // jagged white ruffle at the base
      for (let i = 0; i < 4; i++) {
        box(side * (0.55 + i * 0.055), 2.32 - i * 0.062, 0.24,
            0.070, 0.095, 0.065, P.white, { rz: side * (0.2 + i * 0.18), layer: 6 });
      }
    }

    // --- ahoge --------------------------------------------------------
    beam(-0.02, 2.96, 0.00, 3.27, 0.075, 0.085, 0.02, P.blue2, { layer: 3 });
    beam(0.00, 3.27, -0.24, 3.43, 0.075, 0.08, 0.02, P.blue2, { layer: 3 });
    beam(-0.24, 3.43, -0.45, 3.30, 0.065, 0.075, 0.04, P.sky, { layer: 3 });
    beam(-0.45, 3.30, -0.36, 3.14, 0.055, 0.065, 0.05, P.blue2, { layer: 3 });

    // --- back-of-dress detail for the 360° orbit ----------------------
    box(0, 1.155, -0.395, 0.52, 0.050, 0.060, P.white, { layer: 5 });
    box(0, 1.165, -0.440, 0.105, 0.125, 0.065, P.white, { layer: 6 });
    beam(-0.015, 1.17, -0.330, 1.305, 0.165, 0.085, -0.450, P.white, { layer: 6 });
    beam(0.015, 1.17, 0.330, 1.305, 0.165, 0.085, -0.450, P.white, { layer: 6 });
    beam(-0.025, 1.14, -0.155, 0.735, 0.090, 0.070, -0.445, P.paper, { layer: 6 });
    beam(0.025, 1.14, 0.175, 0.690, 0.085, 0.070, -0.445, P.paper, { layer: 6 });
    // a short lower-back seam below the hair mass
    beam(0, 1.13, 0, 0.78, 0.030, 0.040, -0.365, P.ice, { layer: 4 });
    // back hem ruffle
    for (let i = 0; i < 9; i++) {
      const t = i / 8;
      const x = mix(-0.52, 0.52, t);
      box(x, 0.485, -0.345, 0.115, 0.085, 0.055, P.white,
          { rz: (t - 0.5) * 0.35, layer: 4 });
    }
    // back hair highlights: only visible once the model is orbited around
    for (let i = 0; i < 5; i++) {
      const x = mix(-0.55, 0.55, i / 4);
      beam(x, 2.64, x * 1.18, 1.15, 0.070, 0.06, -0.515, i % 2 ? P.ice : P.sky, { layer: 4 });
    }
    box(0, 1.02, -0.445, 0.11, 0.28, 0.05, P.navy2, { layer: 3 });

    if (UTILITY_PROPS_ENABLED) {
      // --- parked control experiment: toggle console --------------------
      box(-1.55, 0.27, 0.31, 0.56, 0.25, 0.35, P.console, { rz: -0.035 });
      box(-1.55, 0.405, 0.31, 0.48, 0.035, 0.30, P.console2, { rz: -0.035 });
      box(-1.59, 0.435, 0.24, 0.17, 0.055, 0.13, P.steelDk);
      box(-1.60, 0.48, 0.235, 0.07, 0.05, 0.07, P.paper, { layer: 5, tag: 'toggle' });
      beam(-1.60, 0.49, -1.645, 0.60, 0.045, 0.045, 0.235, P.ice, { layer: 6, tag: 'toggle' });
      box(-1.36, 0.417, 0.31, 0.055, 0.018, 0.055, P.lampDim, { layer: 5 });
      for (let i = 0; i < 3; i++) {
        box(-1.80 + i * 0.055, 0.30, 0.487, 0.022, 0.10, 0.012, P.rubber, { layer: 4 });
      }

      // --- parked control experiment: floppy drive ----------------------
      box(1.57, 0.31, 0.20, 0.55, 0.29, 0.36, P.console);
      box(1.57, 0.455, 0.22, 0.49, 0.035, 0.34, P.console2);
      box(1.57, 0.405, 0.405, 0.30, 0.065, 0.022, P.rubber, { layer: 4 });
      box(1.50, 0.465, 0.412, 0.075, 0.014, 0.012, P.gold, { layer: 5 });
      box(1.66, 0.468, 0.414, 0.035, 0.022, 0.016, P.lamp, { layer: 6, tag: 'floppy' });
      box(1.57, 0.625, 0.355, 0.34, 0.34, 0.045, P.blue, { tag: 'floppy', layer: 5 });
      box(1.57, 0.625, 0.382, 0.24, 0.24, 0.012, P.white, { tag: 'floppy', layer: 6 });
      box(1.46, 0.745, 0.392, 0.10, 0.055, 0.012, P.steel, { tag: 'floppy', layer: 7 });
      box(1.57, 0.62, 0.391, 0.16, 0.016, 0.010, P.blue2, { tag: 'floppy', layer: 7 });
      box(1.57, 0.585, 0.391, 0.10, 0.010, 0.010, P.ice, { tag: 'floppy', layer: 7 });
      box(1.73, 0.18, 0.22, 0.10, 0.12, 0.18, P.steelDk);
    }
  }

  buildModel();

  // ============================================================
  // SIX-FACE POINT SAMPLING
  // ============================================================
  const BASE_DENSITY = 24;
  const CAMERA_FACE_BOOST = 3.2;
  // base + extra = 3.2 x camera-facing density. sqrt(3.2 - 1) is the
  // linear-density factor of the extra layer.
  const EXTRA_DENSITY = BASE_DENSITY * Math.sqrt(CAMERA_FACE_BOOST - 1);

  function samplePointCloud() {
    const px = [], py = [], pz = [];
    const nxA = [], nyA = [], nzA = [];
    const shade = [], density = [], group = [], albedos = [], extraA = [];
    const groupIds = { none: 0, toggle: 1, floppy: 2 };
    let basePts = 0, extraPts = 0;

    const L = [-0.42, 0.71, 0.56];
    const ll = Math.hypot(L[0], L[1], L[2]);
    L[0] /= ll; L[1] /= ll; L[2] /= ll;
    const Hx = L[0], Hy = L[1], Hz = L[2] + 1;
    const hl = Math.hypot(Hx, Hy, Hz);
    const hx = Hx / hl, hy = Hy / hl, hz = Hz / hl;
    // A second, weaker back light: without it a 360° orbit makes the back
    // read as an almost black slab, even though the camera-facing face is
    // correctly densified. This stays normal-based; only the albedo term
    // decides whether a surface is white, navy or black.
    const L2 = [0.34, 0.36, -0.87];
    const l2 = Math.hypot(L2[0], L2[1], L2[2]);
    L2[0] /= l2; L2[1] /= l2; L2[2] /= l2;

    const faces = [
      { n: [0, 0, 1],  t1: [1, 0, 0], t2: [0, 1, 0], s1: 'hw', s2: 'hh' },
      { n: [0, 0, -1], t1: [1, 0, 0], t2: [0, 1, 0], s1: 'hw', s2: 'hh' },
      { n: [0, 1, 0],  t1: [1, 0, 0], t2: [0, 0, 1], s1: 'hw', s2: 'hd' },
      { n: [0, -1, 0], t1: [1, 0, 0], t2: [0, 0, 1], s1: 'hw', s2: 'hd' },
      { n: [1, 0, 0],  t1: [0, 1, 0], t2: [0, 0, 1], s1: 'hh', s2: 'hd' },
      { n: [-1, 0, 0], t1: [0, 1, 0], t2: [0, 0, 1], s1: 'hh', s2: 'hd' }
    ];

    for (const b of boxes) {
      const A = albedo(b.color);
      const g = groupIds[b.tag] !== undefined ? groupIds[b.tag] : 0;
      for (let fi = 0; fi < 6; fi++) {
        const f = faces[fi];
        // transform the local face frame into world space
        const nx = b.ax[0] * f.n[0] + b.ay[0] * f.n[1] + b.az[0] * f.n[2];
        const ny = b.ax[1] * f.n[0] + b.ay[1] * f.n[1] + b.az[1] * f.n[2];
        const nz = b.ax[2] * f.n[0] + b.ay[2] * f.n[1] + b.az[2] * f.n[2];
        const t1x = b.ax[0] * f.t1[0] + b.ay[0] * f.t1[1] + b.az[0] * f.t1[2];
        const t1y = b.ax[1] * f.t1[0] + b.ay[1] * f.t1[1] + b.az[1] * f.t1[2];
        const t1z = b.ax[2] * f.t1[0] + b.ay[2] * f.t1[1] + b.az[2] * f.t1[2];
        const t2x = b.ax[0] * f.t2[0] + b.ay[0] * f.t2[1] + b.az[0] * f.t2[2];
        const t2y = b.ax[1] * f.t2[0] + b.ay[1] * f.t2[1] + b.az[1] * f.t2[2];
        const t2z = b.ax[2] * f.t2[0] + b.ay[2] * f.t2[1] + b.az[2] * f.t2[2];

        const half1 = b[f.s1], half2 = b[f.s2];
        const size1 = half1 * 2, size2 = half2 * 2;
        const keyLight = Math.max(0, nx * L[0] + ny * L[1] + nz * L[2]);
        const backFill = Math.max(0, nx * L2[0] + ny * L2[1] + nz * L2[2]);
        const diff = 0.32 + 0.50 * keyLight + 0.34 * backFill;
        const spec = Math.pow(Math.max(0, nx * hx + ny * hy + nz * hz), 22) * 0.18;
        // Albedo remains the energy source. The filmic shoulder lifts the
        // white apron / blue eyes while letting the dark navy hair recede;
        // the silhouette pass keeps its outer contour readable.
        const lit = clamp(Math.pow(clamp(A * diff + spec, 0, 1), 1.6) * 1.35, 0.006, 1.0);

        // 0 = base cloud for every face; 1 = extra layer used only when that
        // face currently points at the camera. The same camera-relative rule
        // therefore holds at 0°, 180° and every angle between.
        for (let layer = 0; layer < 2; layer++) {
          const isExtra = layer === 1;
          const densityPerUnit = isExtra ? EXTRA_DENSITY : BASE_DENSITY;
          const nu = clamp(Math.ceil(size1 * densityPerUnit) + 2, 3, 190);
          const nv = clamp(Math.ceil(size2 * densityPerUnit) + 2, 3, 190);
          for (let j = 0; j < nv; j++) {
            for (let i = 0; i < nu; i++) {
              const seed = (b.id + 1) * 733 + fi * 101 + i * 131 + j * 977 +
                           (isExtra ? 500009 : 0);
              const j1 = (hash(seed) - 0.5) * 0.66 / nu;
              const j2 = (hash(seed + 17.17) - 0.5) * 0.66 / nv;
              const u = (i + 0.5) / nu - 0.5 + j1;
              const v = (j + 0.5) / nv - 0.5 + j2;
              const o1 = u * size1, o2 = v * size2;
              px.push(b.x + t1x * o1 + t2x * o2);
              py.push(b.y + t1y * o1 + t2y * o2);
              pz.push(b.z + t1z * o1 + t2z * o2);
              nxA.push(nx); nyA.push(ny); nzA.push(nz);
              shade.push(lit);
              density.push(isExtra ? 1.0 : 0.3125);
              group.push(g);
              // Explicit per-point albedo, as required.
              albedos.push(A);
              extraA.push(isExtra ? 1 : 0);
              if (isExtra) extraPts++; else basePts++;
            }
          }
        }
      }
    }

    return {
      n: px.length,
      px: new Float32Array(px),
      py: new Float32Array(py),
      pz: new Float32Array(pz),
      nx: new Float32Array(nxA),
      ny: new Float32Array(nyA),
      nz: new Float32Array(nzA),
      shade: new Float32Array(shade),
      density: new Float32Array(density),
      group: new Uint8Array(group),
      albedo: new Float32Array(albedos),
      extra: new Uint8Array(extraA),
      stats: { basePts, extraPts, faces: boxes.length * 6 }
    };
  }

  const cloud = samplePointCloud();

  // ============================================================
  // CAMERA
  // ============================================================
  const CAM_TARGET = [0, 1.72, 0];
  const CAM_RADIUS = 6.55;
  const FOCAL = 1120;

  // Optional debug start angle, e.g. index.html?yaw=180 for back-view review.
  const debugYaw = Number(new URLSearchParams(window.location.search).get('yaw'));
  const initialYaw = Number.isFinite(debugYaw) ? debugYaw * Math.PI / 180 : 0;

  const state = {
    yaw: initialYaw,
    pitch: 0.015,
    dragging: false,
    dragMoved: 0,
    lastX: 0,
    lastY: 0,
    startYaw: 0,
    startPitch: 0,
    bootAt: performance.now()
  };

  function normalizeDegrees(rad) {
    return ((rad * 180 / Math.PI) % 360 + 360) % 360;
  }

  function cameraAt(time) {
    // Idle drift is a pure trig function of the supplied time.
    const idleYaw = Math.sin(time * 0.37) * 0.018 + Math.sin(time * 0.113) * 0.007;
    const idlePitch = Math.sin(time * 0.29 + 1.2) * 0.005;
    const yaw = state.yaw + idleYaw;
    const pitch = clamp(state.pitch, -0.20, 0.20) + idlePitch;
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    const cam = [
      CAM_TARGET[0] + Math.sin(yaw) * CAM_RADIUS * cp,
      CAM_TARGET[1] + sp * CAM_RADIUS,
      CAM_TARGET[2] + Math.cos(yaw) * CAM_RADIUS * cp
    ];
    let fx = CAM_TARGET[0] - cam[0];
    let fy = CAM_TARGET[1] - cam[1];
    let fz = CAM_TARGET[2] - cam[2];
    const fl = Math.hypot(fx, fy, fz);
    fx /= fl; fy /= fl; fz /= fl;
    // right = normalize(cross(forward, worldUp))
    let rx = -fz, ry = 0, rz = fx;
    const rl = Math.hypot(rx, ry, rz);
    rx /= rl; ry /= rl; rz /= rl;
    // up = cross(right, forward)
    const ux = ry * fz - rz * fy;
    const uy = rz * fx - rx * fz;
    const uz = rx * fy - ry * fx;
    return { cam, f: [fx, fy, fz], r: [rx, ry, rz], u: [ux, uy, uz], yaw, pitch };
  }

  function projectWorld(x, y, z, view, out) {
    const dx = x - view.cam[0], dy = y - view.cam[1], dz = z - view.cam[2];
    const vx = dx * view.r[0] + dy * view.r[1] + dz * view.r[2];
    const vy = dx * view.u[0] + dy * view.u[1] + dz * view.u[2];
    const vz = dx * view.f[0] + dy * view.f[1] + dz * view.f[2];
    if (vz <= 0.15) return false;
    out.x = INNER_X + INNER_W * 0.5 + vx * FOCAL / vz;
    out.y = INNER_Y + INNER_H * 0.5 - vy * FOCAL / vz;
    out.z = vz;
    return true;
  }

  // ============================================================
  // Z-BUFFERED POINT PROJECTION
  // ============================================================
  const pixN = INNER_W * INNER_H;
  const zbuf = new Float32Array(pixN);
  const lumBuf = new Float32Array(pixN);
  const covBuf = new Uint8Array(pixN);
  const splatOffsets = [];
  const splatOffsetsWide = [];
  for (let dy = -2; dy <= 2; dy++) {
    for (let dx = -2; dx <= 2; dx++) {
      if (dx * dx + dy * dy <= 4.8) splatOffsetsWide.push([dx, dy]);
      if (Math.abs(dx) <= 1 && Math.abs(dy) <= 1) splatOffsets.push([dx, dy]);
    }
  }

  function renderPointBuffer(view) {
    zbuf.fill(1e9);
    lumBuf.fill(0);
    covBuf.fill(0);

    const cw = INNER_W, chh = INNER_H;
    // Project into inner-screen buffer coordinates. The ASCII field will later
    // be blitted at INNER_X / INNER_Y.
    const cx = cw * 0.5, cy = chh * 0.5;
    const cam = view.cam;
    const rx = view.r[0], ry = view.r[1], rz = view.r[2];
    const ux = view.u[0], uy = view.u[1], uz = view.u[2];
    const fx = view.f[0], fy = view.f[1], fz = view.f[2];
    const n = cloud.n;
    const pxs = cloud.px, pys = cloud.py, pzs = cloud.pz;
    const nxA = cloud.nx, nyA = cloud.ny, nzA = cloud.nz;
    const shades = cloud.shade, extra = cloud.extra;
    let visible = 0;

    for (let i = 0; i < n; i++) {
      const x = pxs[i], y = pys[i], z = pzs[i];
      const dx = x - cam[0], dy = y - cam[1], dz = z - cam[2];
      const vz = dx * fx + dy * fy + dz * fz;
      if (vz <= 0.2) continue;

      // Base points always exist. Extra points are the 2.2x area fill that
      // turns the face-currently-toward-the-camera into a 3.2x dense face.
      if (extra[i]) {
        const towardCamX = cam[0] - x;
        const towardCamY = cam[1] - y;
        const towardCamZ = cam[2] - z;
        if (nxA[i] * towardCamX + nyA[i] * towardCamY + nzA[i] * towardCamZ <= 0) continue;
      }

      const vx = dx * rx + dy * ry + dz * rz;
      const vy = dx * ux + dy * uy + dz * uz;
      const sx = (cx + vx * FOCAL / vz) | 0;
      const sy = (cy - vy * FOCAL / vz) | 0;
      const offsets = extra[i] ? splatOffsetsWide : splatOffsets;
      const r = extra[i] ? 2 : 1;
      if (sx < r || sy < r || sx >= cw - r || sy >= chh - r) continue;
      const value = shades[i];
      for (let o = 0; o < offsets.length; o++) {
        const xx = sx + offsets[o][0];
        const yy = sy + offsets[o][1];
        const idx = yy * cw + xx;
        if (vz < zbuf[idx]) {
          zbuf[idx] = vz;
          lumBuf[idx] = value;
          covBuf[idx] = 1;
          if (offsets[o][0] === 0 && offsets[o][1] === 0) visible++;
        }
      }
    }
    return visible;
  }

  // ============================================================
  // 3x3 SUBSAMPLE -> 120x45 CELLS -> SOBEL + SILHOUETTE
  // ============================================================
  const cellBase = new Float32Array(GRID_W * GRID_H);
  const cellCov = new Float32Array(GRID_W * GRID_H);
  const cellEdge = new Float32Array(GRID_W * GRID_H);
  const cellSil = new Float32Array(GRID_W * GRID_H);
  const cellV = new Float32Array(GRID_W * GRID_H);
  const cellChar = new Uint8Array(GRID_W * GRID_H);
  const LUT = ' .:-=+*#%@';

  function reduceCells() {
    for (let gy = 0; gy < GRID_H; gy++) {
      for (let gx = 0; gx < GRID_W; gx++) {
        let sum = 0, cov = 0;
        // 3 x 3 supersamples, each from a cell-sized subregion (8x16 px).
        for (let sy = 0; sy < 3; sy++) {
          const py = INNER_Y + gy * CELL_H + Math.floor((sy + 0.5) * CELL_H / 3);
          for (let sx = 0; sx < 3; sx++) {
            const px = INNER_X + gx * CELL_W + Math.floor((sx + 0.5) * CELL_W / 3);
            // Buffer indices are relative to the inner screen.
            const bx = px - INNER_X, by = py - INNER_Y;
            sum += lumBuf[by * INNER_W + bx];
            cov += covBuf[by * INNER_W + bx];
          }
        }
        const ci = gy * GRID_W + gx;
        cellBase[ci] = sum / 9;
        cellCov[ci] = cov / 9;
      }
    }

    // Sobel on the reduced luminance field.
    const sobelX = [-1, 0, 1, -2, 0, 2, -1, 0, 1];
    const sobelY = [-1, -2, -1, 0, 0, 0, 1, 2, 1];
    for (let y = 0; y < GRID_H; y++) {
      for (let x = 0; x < GRID_W; x++) {
        let gx = 0, gyS = 0;
        let k = 0;
        for (let yy = -1; yy <= 1; yy++) {
          for (let xx = -1; xx <= 1; xx++) {
            const sx = clamp(x + xx, 0, GRID_W - 1);
            const sy = clamp(y + yy, 0, GRID_H - 1);
            const v = cellBase[sy * GRID_W + sx];
            gx += v * sobelX[k];
            gyS += v * sobelY[k];
            k++;
          }
        }
        const i = y * GRID_W + x;
        // Proper Sobel normalization: each axis kernel has positive weight 4,
        // so the maximum possible magnitude is 4*sqrt(2). The contour is then
        // gated by the local base value. Without the gate, the 2-cell-wide
        // black pupils pick up the full rim gradient of the bright iris and
        // are lifted into the same bright glyphs as the skin around them.
        const rawEdge = Math.min(1, Math.hypot(gx, gyS) / (4 * Math.SQRT2));
        const edgeGate = clamp((cellBase[i] - 0.035) / 0.18, 0, 1);
        cellEdge[i] = rawEdge * edgeGate;
        cellSil[i] = cellCov[i];
        // The requested composite. Albedo-linked base, Sobel edge, coverage silhouette.
        const v = cellBase[i] * 0.68 + cellEdge[i] * 0.50 + cellSil[i] * 0.34;
        cellV[i] = clamp(v, 0, 0.9999);
        cellChar[i] = Math.floor(cellV[i] * 9.999);
      }
    }
  }

  // ============================================================
  // STATIC CRT SHELL
  // ============================================================
  const shell = document.createElement('canvas');
  shell.width = W; shell.height = H;
  const sctx = shell.getContext('2d');

  function roundRect(c, x, y, w, h, r) {
    r = Math.min(r, w * 0.5, h * 0.5);
    c.beginPath();
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y);
    c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r);
    c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r);
    c.quadraticCurveTo(x, y, x + r, y);
    c.closePath();
  }

  function buildShell() {
    const c = sctx;
    // room backdrop
    const bg = c.createRadialGradient(W * 0.5, H * 0.45, 60, W * 0.5, H * 0.5, W * 0.7);
    bg.addColorStop(0, '#0b1a22');
    bg.addColorStop(0.48, '#050c11');
    bg.addColorStop(1, '#010204');
    c.fillStyle = bg;
    c.fillRect(0, 0, W, H);

    // faint engineering grid
    c.save();
    c.globalAlpha = 0.16;
    c.strokeStyle = '#27515e';
    c.lineWidth = 1;
    for (let x = 32; x < W; x += 64) {
      c.beginPath(); c.moveTo(x + 0.5, 0); c.lineTo(x + 0.5, H); c.stroke();
    }
    for (let y = 24; y < H; y += 64) {
      c.beginPath(); c.moveTo(0, y + 0.5); c.lineTo(W, y + 0.5); c.stroke();
    }
    c.restore();

    // outer dock
    const dock = c.createLinearGradient(0, 0, 0, H);
    dock.addColorStop(0, 'rgba(16, 30, 38, .80)');
    dock.addColorStop(0.5, 'rgba(7, 15, 20, .94)');
    dock.addColorStop(1, 'rgba(2, 7, 10, .98)');
    c.fillStyle = dock;
    roundRect(c, 22, 22, W - 44, H - 44, 27);
    c.fill();
    c.strokeStyle = 'rgba(109, 176, 195, .34)';
    c.lineWidth = 2;
    c.stroke();
    c.strokeStyle = 'rgba(0, 0, 0, .72)';
    c.lineWidth = 6;
    roundRect(c, 30, 30, W - 60, H - 60, 21);
    c.stroke();

    // screws
    for (const p of [[45, 45], [W - 45, 45], [45, H - 45], [W - 45, H - 45]]) {
      c.fillStyle = '#0a141a';
      c.beginPath(); c.arc(p[0], p[1], 8, 0, TAU); c.fill();
      c.strokeStyle = '#41606a'; c.lineWidth = 2; c.stroke();
      c.strokeStyle = '#6c929a'; c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(p[0] - 4, p[1]); c.lineTo(p[0] + 4, p[1]); c.stroke();
    }

    // monitor housing
    c.save();
    c.shadowColor = 'rgba(38, 171, 196, .20)';
    c.shadowBlur = 44;
    const bezel = c.createLinearGradient(0, 82, 0, 886);
    bezel.addColorStop(0, '#1b2c34');
    bezel.addColorStop(0.18, '#0e1b22');
    bezel.addColorStop(0.82, '#071116');
    bezel.addColorStop(1, '#020608');
    c.fillStyle = bezel;
    roundRect(c, 292, 84, 1016, 792, 24);
    c.fill();
    c.restore();
    c.strokeStyle = 'rgba(128, 205, 216, .27)';
    c.lineWidth = 2;
    roundRect(c, 294, 86, 1012, 788, 22);
    c.stroke();
    c.strokeStyle = 'rgba(0,0,0,.9)';
    c.lineWidth = 8;
    roundRect(c, 310, 102, 980, 756, 15);
    c.stroke();
    c.strokeStyle = 'rgba(133, 218, 224, .15)';
    c.lineWidth = 1;
    roundRect(c, 315, 107, 970, 746, 12);
    c.stroke();

    // screen well
    const screenBg = c.createRadialGradient(
      INNER_X + INNER_W * 0.5, INNER_Y + INNER_H * 0.48, 20,
      INNER_X + INNER_W * 0.5, INNER_Y + INNER_H * 0.52, INNER_W * 0.76
    );
    screenBg.addColorStop(0, '#061b23');
    screenBg.addColorStop(0.55, '#031017');
    screenBg.addColorStop(1, '#01070b');
    c.fillStyle = screenBg;
    c.fillRect(INNER_X, INNER_Y, INNER_W, INNER_H);

    // A dim projector halo sits behind the point cloud so the dark navy hair
    // still has an outer contour against the glass.
    const halo = c.createRadialGradient(
      INNER_X + INNER_W * 0.5, INNER_Y + 300, 40,
      INNER_X + INNER_W * 0.5, INNER_Y + 340, 370
    );
    halo.addColorStop(0, 'rgba(40, 126, 145, .18)');
    halo.addColorStop(0.46, 'rgba(25, 88, 108, .10)');
    halo.addColorStop(1, 'rgba(0, 0, 0, 0)');
    c.fillStyle = halo;
    c.fillRect(INNER_X, INNER_Y, INNER_W, INNER_H);

    // faint sub-cell raster and a soft holo floor
    c.save();
    c.beginPath();
    c.rect(INNER_X, INNER_Y, INNER_W, INNER_H);
    c.clip();
    c.strokeStyle = 'rgba(87, 179, 195, .045)';
    c.lineWidth = 1;
    for (let x = INNER_X; x <= INNER_X + INNER_W; x += 8) {
      c.beginPath(); c.moveTo(x + .5, INNER_Y); c.lineTo(x + .5, INNER_Y + INNER_H); c.stroke();
    }
    for (let y = INNER_Y; y <= INNER_Y + INNER_H; y += 16) {
      c.beginPath(); c.moveTo(INNER_X, y + .5); c.lineTo(INNER_X + INNER_W, y + .5); c.stroke();
    }
    const floor = c.createRadialGradient(INNER_X + 480, INNER_Y + 623, 4, INNER_X + 480, INNER_Y + 623, 340);
    floor.addColorStop(0, 'rgba(40, 137, 155, .15)');
    floor.addColorStop(0.56, 'rgba(21, 83, 101, .055)');
    floor.addColorStop(1, 'rgba(0, 0, 0, 0)');
    c.fillStyle = floor;
    c.fillRect(INNER_X, INNER_Y + 420, INNER_W, 300);
    c.restore();

    // screen corner brackets
    c.strokeStyle = 'rgba(113, 222, 230, .62)';
    c.lineWidth = 2;
    const corners = [
      [INNER_X + 7, INNER_Y + 7, 1, 1],
      [INNER_X + INNER_W - 7, INNER_Y + 7, -1, 1],
      [INNER_X + 7, INNER_Y + INNER_H - 7, 1, -1],
      [INNER_X + INNER_W - 7, INNER_Y + INNER_H - 7, -1, -1]
    ];
    for (const q of corners) {
      c.beginPath();
      c.moveTo(q[0] + q[2] * 26, q[1]);
      c.lineTo(q[0], q[1]);
      c.lineTo(q[0], q[1] + q[3] * 26);
      c.stroke();
    }

    // bezel typography
    c.font = '600 12px "Courier New", monospace';
    c.fillStyle = 'rgba(151, 216, 220, .60)';
    c.textAlign = 'left';
    c.fillText('MODEL 07 / CETACEAN-MAID', 328, 100);
    c.textAlign = 'right';
    c.fillText('FIELD 120×45 · CELL 8×16', 1270, 100);
    c.font = '600 10px "Courier New", monospace';
    c.fillStyle = 'rgba(116, 170, 179, .46)';
    c.textAlign = 'left';
    c.fillText('CAMERA  ·  360° ORBIT', 332, 873);
    c.textAlign = 'right';
    c.fillText('Z-BUFFER  ·  LIVE', 1270, 873);

    // side rails
    c.strokeStyle = 'rgba(87, 157, 170, .25)';
    c.lineWidth = 1;
    c.beginPath(); c.moveTo(288, 128); c.lineTo(288, 842); c.stroke();
    c.beginPath(); c.moveTo(1312, 128); c.lineTo(1312, 842); c.stroke();

    // ventilation bars on bottom bezel
    c.save();
    c.globalAlpha = 0.38;
    c.fillStyle = '#0a1419';
    for (let i = 0; i < 20; i++) {
      roundRect(c, 610 + i * 21, 855, 11, 3, 1.4);
      c.fill();
    }
    c.restore();

    // header
    c.textAlign = 'left';
    c.fillStyle = 'rgba(144, 222, 227, .75)';
    c.font = '600 13px "Courier New", monospace';
    c.fillText('D S H  //  DEEP-SEA VISUAL TERMINAL', 48, 58);
    c.fillStyle = 'rgba(88, 151, 160, .52)';
    c.font = '11px "Courier New", monospace';
    c.fillText('OFFLINE HARDWARE MONITOR · NO WEBGL · NO DEPENDENCIES', 48, 78);
    c.textAlign = 'right';
    c.fillStyle = 'rgba(150, 223, 226, .72)';
    c.fillText('SYS.TIME', 1552, 58);
    c.fillStyle = 'rgba(84, 141, 151, .55)';
    c.fillText('PHOSPHOR LUT / 10-STEP', 1552, 78);

    // footer
    c.strokeStyle = 'rgba(82, 149, 160, .30)';
    c.beginPath(); c.moveTo(48, 906); c.lineTo(1552, 906); c.stroke();
    c.textAlign = 'left';
    c.fillStyle = 'rgba(111, 177, 185, .64)';
    c.font = '11px "Courier New", monospace';
    c.fillText('ORIENTED BOXES → 6-FACE POINT CLOUD → SOFTWARE Z-BUFFER → 3×3 SUPERSAMPLE → 120×45 GLYPHS', 48, 928);
    c.textAlign = 'right';
    c.fillStyle = 'rgba(72, 121, 130, .62)';
    c.fillText('CAMERA-FACE DENSITY ×3.2', 1552, 928);

    // side panel frames
    c.strokeStyle = 'rgba(91, 163, 175, .22)';
    c.strokeRect(44, 104, 226, 770);
    c.strokeRect(1330, 104, 226, 770);
    c.fillStyle = 'rgba(72, 145, 158, .08)';
    c.fillRect(44, 104, 226, 26);
    c.fillRect(1330, 104, 226, 26);
    c.fillStyle = 'rgba(138, 210, 216, .66)';
    c.font = '600 11px "Courier New", monospace';
    c.textAlign = 'left';
    c.fillText('01 / TELEMETRY', 56, 120);
    c.fillText('02 / CAMERA BAY', 1342, 120);
  }
  buildShell();

  // scanline + aperture-grille + vignette layers (precomputed, deterministic)
  const fxCanvas = document.createElement('canvas');
  fxCanvas.width = W; fxCanvas.height = H;
  const fctx = fxCanvas.getContext('2d');
  function buildFX() {
    const c = fctx;
    c.clearRect(0, 0, W, H);
    // scanlines across the whole plate
    c.fillStyle = 'rgba(0, 0, 0, .15)';
    for (let y = 0; y < H; y += 3) c.fillRect(0, y, W, 1);
    // aperture-grille RGB triads, only inside glass
    c.save();
    c.beginPath();
    c.rect(INNER_X, INNER_Y, INNER_W, INNER_H);
    c.clip();
    c.globalCompositeOperation = 'screen';
    c.globalAlpha = 0.06;
    for (let x = INNER_X; x < INNER_X + INNER_W; x += 3) {
      c.fillStyle = (x % 9 === 0) ? '#ff4f68' : (x % 9 === 3) ? '#4dff9f' : '#4f8cff';
      c.fillRect(x, INNER_Y, 1, INNER_H);
    }
    c.restore();

    // vignette
    const vg = c.createRadialGradient(W * .5, H * .48, H * .24, W * .5, H * .5, H * .74);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(0.58, 'rgba(0,0,0,.055)');
    vg.addColorStop(1, 'rgba(0,0,0,.58)');
    c.fillStyle = vg;
    c.fillRect(0, 0, W, H);

    // glass reflection
    c.save();
    c.beginPath();
    c.rect(INNER_X, INNER_Y, INNER_W, INNER_H);
    c.clip();
    const glass = c.createLinearGradient(INNER_X, INNER_Y, INNER_X + INNER_W, INNER_Y + INNER_H);
    glass.addColorStop(0, 'rgba(180, 255, 255, .06)');
    glass.addColorStop(0.22, 'rgba(180, 255, 255, .012)');
    glass.addColorStop(0.55, 'rgba(0, 0, 0, 0)');
    glass.addColorStop(1, 'rgba(0, 0, 0, .16)');
    c.fillStyle = glass;
    c.fillRect(INNER_X, INNER_Y, INNER_W, INNER_H);
    // faint glass scratches: deterministic math, not noise
    c.strokeStyle = 'rgba(201, 255, 255, .028)';
    c.lineWidth = 1;
    for (let i = 0; i < 5; i++) {
      const x = INNER_X + 90 + i * 185;
      c.beginPath();
      c.moveTo(x, INNER_Y);
      c.lineTo(x + 120, INNER_Y + INNER_H);
      c.stroke();
    }
    c.restore();
  }
  buildFX();

  const palette = [
    '#000000',
    '#071f27',
    '#0a2e37',
    '#0e3f4a',
    '#12525f',
    '#1d7c8b',
    '#3bb7c4',
    '#78e4eb',
    '#b9f9fd',
    '#f7ffff'
  ];

  const glyphLayer = document.createElement('canvas');
  glyphLayer.width = INNER_W;
  glyphLayer.height = INNER_H;
  const gctx = glyphLayer.getContext('2d');

  function drawGlyphField() {
    gctx.clearRect(0, 0, INNER_W, INNER_H);
    gctx.font = '700 15px "Consolas", "Courier New", monospace';
    gctx.textAlign = 'center';
    gctx.textBaseline = 'middle';
    for (let gy = 0; gy < GRID_H; gy++) {
      const y = gy * CELL_H + CELL_H * 0.5;
      for (let gx = 0; gx < GRID_W; gx++) {
        const lvl = cellChar[gy * GRID_W + gx];
        if (lvl === 0) continue;
        gctx.fillStyle = palette[lvl];
        gctx.globalAlpha = lvl <= 2 ? 0.9 : 1;
        gctx.fillText(LUT[lvl], gx * CELL_W + CELL_W * 0.5, y);
      }
    }

    // Phosphor bloom: a single blurred composite, then the crisp glyph field.
    // It is still the same 10-step character data, just displayed through glass.
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.38;
    ctx.filter = 'blur(2.1px)';
    ctx.drawImage(glyphLayer, INNER_X, INNER_Y);
    ctx.restore();
    ctx.drawImage(glyphLayer, INNER_X, INNER_Y);
  }

    // central tiny mode flag just above glass

    ctx.fillStyle = 'rgba(82, 143, 153, .58)';

    ctx.fillStyle = 'rgba(77, 136, 146, .48)';
    ctx.fillText('UTC+08  /  HONG KONG', 1342, 764);

    ctx.restore();
  }

  // ============================================================
  // INPUT — one continuous 360° horizontal orbit, no auxiliary props
  // ============================================================
  function canvasPoint(ev) {
    const r = canvas.getBoundingClientRect();
    return {
      x: (ev.clientX - r.left) * W / r.width,
      y: (ev.clientY - r.top) * H / r.height
    };
  }

  canvas.addEventListener('pointerdown', ev => {
    canvas.focus();
    const p = canvasPoint(ev);
    if (p.x >= INNER_X && p.x <= INNER_X + INNER_W && p.y >= INNER_Y && p.y <= INNER_Y + INNER_H) {
      state.dragging = true;
      state.dragMoved = 0;
      state.lastX = ev.clientX;
      state.lastY = ev.clientY;
      state.startYaw = state.yaw;
      state.startPitch = state.pitch;
      canvas.classList.add('dragging');
      canvas.setPointerCapture(ev.pointerId);
    }
  });

  canvas.addEventListener('pointermove', ev => {
    if (state.dragging) {
      const dx = ev.clientX - state.lastX;
      const dy = ev.clientY - state.lastY;
      state.dragMoved += Math.abs(dx) + Math.abs(dy);
      // 0.0075 rad/px lets a single screen-wide drag pass 180°.
      // Drag direction is inverted so the model follows the pointer.
      state.yaw = state.startYaw - dx * 0.0075;
      state.pitch = clamp(state.startPitch - dy * 0.0035, -0.20, 0.20);
    }
  });

  function endDrag(ev) {
    if (!state.dragging) return;
    state.dragging = false;
    canvas.classList.remove('dragging');
    try { canvas.releasePointerCapture(ev.pointerId); } catch (_) {}
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  window.addEventListener('keydown', ev => {
    if (ev.key === 'r' || ev.key === 'R') {
      state.yaw = 0; state.pitch = 0.015;
    } else if (ev.key === 'ArrowLeft') {
      state.yaw -= 0.15;
      ev.preventDefault();
    } else if (ev.key === 'ArrowRight') {
      state.yaw += 0.15;
      ev.preventDefault();
    }
  });

  // ============================================================
  // MAIN LOOP
  // ============================================================
  function draw(timeMs) {
    const time = timeMs * 0.001;
    const view = cameraAt(time);
    const visiblePts = renderPointBuffer(view);
    reduceCells();

    ctx.drawImage(shell, 0, 0);

    // screen raster is drawn with the deterministic 10-step LUT
    drawGlyphField();

    // small in-screen recording mark and cell coordinates
    ctx.save();
    ctx.font = '10px "Courier New", monospace';
    ctx.fillStyle = 'rgba(119, 215, 220, .52)';
    ctx.textAlign = 'left';
    ctx.fillText('● LIVE FIELD', INNER_X + 18, INNER_Y + 24);
    ctx.textAlign = 'right';
    ctx.fillText('Z-BUF / SUPERSAMPLE 9', INNER_X + INNER_W - 18, INNER_Y + 24);
    ctx.restore();

    drawHeadHUD(time, visiblePts);

    // The entire plate receives scanlines, aperture grille, vignette, glass.
    ctx.drawImage(fxCanvas, 0, 0);

    // Deterministic refresh shimmer: a trig function, never a random value.
    const shimmer = 0.5 + 0.5 * Math.sin(time * 17.31) * Math.sin(time * 2.113);
    ctx.fillStyle = 'rgba(1, 7, 10, ' + (0.012 + shimmer * 0.012).toFixed(4) + ')';
    ctx.fillRect(0, 0, W, H);

    // a thin bright sweep for CRT life
    const sweepY = INNER_Y + ((time * 56) % (INNER_H + 90)) - 45;
    const sw = ctx.createLinearGradient(0, sweepY - 36, 0, sweepY + 36);
    sw.addColorStop(0, 'rgba(107, 255, 255, 0)');
    sw.addColorStop(0.5, 'rgba(111, 249, 255, .045)');
    sw.addColorStop(1, 'rgba(107, 255, 255, 0)');
    ctx.fillStyle = sw;
    ctx.fillRect(INNER_X, sweepY - 36, INNER_W, 72);

    requestAnimationFrame(draw);
  }

  // expose a tiny read-only debug surface for the acceptance round
  window.__WHALE = Object.freeze({
    cloudPoints: cloud.n,
    stats: cloud.stats,
    dimensions: { canvas: [W, H], grid: [GRID_W, GRID_H], cell: [CELL_W, CELL_H] },
    orbit: 'full-360',
    utilityPropsEnabled: UTILITY_PROPS_ENABLED,
    constants: { cameraFaceDensity: CAMERA_FACE_BOOST, composite: 'base*0.68+edge*0.50+sil*0.34' },
    // Read-only text snapshot, useful for offline regression checks.
    ascii: () => {
      const out = [];
      for (let y = 0; y < GRID_H; y++) {
        let line = '';
        for (let x = 0; x < GRID_W; x++) line += LUT[cellChar[y * GRID_W + x]];
        out.push(line);
      }
      return out.join('\n');
    }
  });

  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
